<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Farmer Signup - Market-Connect</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <nav class="main-nav">
    <a href="index.html">Home</a> |
    <a href="login-buyer.html">Buyer Login</a> |
    <a href="signup-buyer.html">Buyer Signup</a> |
    <a href="login-farmer.html">Farmer Login</a>
  </nav>

  <header class="hero">
    <h1>Farmer Signup</h1>
  </header>

  <section class="content-section">
    <form id="signup-farmer-form">
      <label for="farmer-name">Name:</label><br/>
      <input type="text" id="farmer-name" name="farmer-name" required /><br/><br/>
      <label for="farmer-email">Email:</label><br/>
      <input type="email" id="farmer-email" name="farmer-email" required /><br/><br/>
      <label for="farmer-password">Password:</label><br/>
      <input type="password" id="farmer-password" name="farmer-password" required /><br/><br/>
      <button type="submit" class="btn btn-primary">Sign Up</button>
    </form>
    <p>Already have an account? <a href="login-farmer.html">Login here</a>.</p>
  </section>
</body>
</html>
