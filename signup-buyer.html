<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Buyer Signup - Market-Connect</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <nav class="main-nav">
    <a href="home.html">Home</a> |
    <a href="login-buyer.html">Buyer Login</a> |
    <a href="signup-farmer.html">Farmer Signup</a> |
    <a href="login-farmer.html">Farmer Login</a>
  </nav>

  <header class="hero">
    <h1>Buyer Signup</h1>
  </header>

  <section class="content-section">
    <form id="signup-buyer-form">
      <label for="buyer-name">Name:</label><br/>
      <input type="text" id="buyer-name" name="buyer-name" required /><br/><br/>
      <label for="buyer-email">Email:</label><br/>
      <input type="email" id="buyer-email" name="buyer-email" required /><br/><br/>
      <label for="buyer-password">Password:</label><br/>
      <input type="password" id="buyer-password" name="buyer-password" required /><br/><br/>
      <button type="submit" class="btn btn-primary">Sign Up</button>
    </form>
    <p>Already have an account? <a href="login-buyer.html">Login here</a>.</p>
  </section>
</body>
</html>
